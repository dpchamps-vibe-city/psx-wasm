# Title screen to early gameplay (M4 task 10): skip the intro, NEW GAME,
# advance the opening dialogue, name "A", birthday Spring 1, farm "A",
# then walk the farm in four directions. Presses are frame-counter values
# ([oracle] frame_counter); BUTTON@AT:HOLD holds for HOLD counter steps.
# Authored from headless frame dumps (`psxw run btn --replay
# title-to-gameplay --render server --dump-frames DIR`). From counter 1510
# on, CROSS (advance, or type a letter) alternates with START (confirm a
# name), so the naming screens need no exact timing.
