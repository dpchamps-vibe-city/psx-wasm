# Harvest Moon: Back to Nature (SLUS-01115).
# Everything game-specific the toolchain needs that the pinned repo doesn't
# already say. Paths under [containers], [c] and [probe] are relative to the
# snapshot; [reference] is relative to the local checkout. Original bytes
# come from each splat config's target_path/sha1 in the local checkout.

[game]
id = "btn"
title = "Harvest Moon: Back to Nature"
serial = "SLUS-01115"
input = "btn"               # [game.btn] in inputs.lock
sdk = "psyq-470"            # [sdk.psyq-470] in inputs.lock
boundary = "boundary/psyq.toml"

[containers]
# One container per splat config; its id is the file stem.
splat_dir = "configs/splat"
# <id>.txt and <id>.names.txt per container (splat symbol_addrs format).
# A container also sees the names in another container's file when its
# splat config lists that file in symbol_addrs_path.
symbols_dir = "configs/symbols"
main = "exe"

[c]
include = ["include", "include/psyq"]
defines = ["__GNUC__=2", "_LANGUAGE_C", "INCLUDE_ASM_USE_MACRO_INC=1"]

[probe]
# Every header under these dirs is probed for struct layout and global sizes.
include_dirs = ["include"]
# Always included ahead of the probed header.
prelude = ["common.h", "game_types.h"]
# m2c-only context headers that redefine game types.
exclude = ["sdk_types.h", "functions.h"]

[reference]
# The matching compiler, used read-only as the layout oracle.
cpp = "mips-linux-gnu-cpp"
cppflags = ["-Iinclude", "-Iinclude/psyq", "-undef", "-D__GNUC__=2", "-DINCLUDE_ASM_USE_MACRO_INC=1", "-lang-c", "-D_LANGUAGE_C"]
cc1 = "tools/vendor/old-gcc/build-gcc-2.95.2-psx/cc1"
cc1flags = ["-O2", "-G8", "-mips1", "-mcpu=r3000", "-funsigned-char", "-fpeephole", "-ffunction-cse", "-fpcc-struct-return", "-fcommon", "-msoft-float", "-mgas", "-fgnu-linker", "-quiet"]

[run]
# Entered once the game reaches its main loop (M2 boot check).
main_loop_symbol = "RunSceneUpdateLoop"
cd_timing = "realistic"

[conform]
# libetc's scenario (psxw conform btn --lib libetc) installs this as its
# interrupt callback: Rand steps the LCG in gRandomState and ignores its
# argument for that.
callback = "Rand"
callback_state = "gRandomState"

[oracle]
# The whole-game RAM oracle aligns on this counter: RunSceneUpdateLoop adds
# one to field +8 of the game state block every scene frame, and
# state_memory_init zeroes the block once at boot.
frame_counter = "D_8006C838+0x8"

[oracle.exclude_symbols]

# The default replay (psxw oracle play/ramdiff without --replay): the boot
# sequence, then START and CROSS pulses through the title screen. Presses
# are at frame-counter values (the replay's clock is [oracle] frame_counter),
# so both sides see them at the same game state; `frames` is vblanks run.
[oracle.replay]
frames = 4200
press = ["START@400", "START@550", "START@700", "START@850", "CROSS@1000", "CROSS@1150", "CROSS@1300", "CROSS@1450"]

# Per-function tier pins, each with its evidence. Only for function-specific
# defects; GCC/GNU C idioms get normalizer rules instead.
[tier]

# Functions the M1 difftest can't compare on random inputs, with evidence.
# Each is local-array UB reached only with inputs outside the function's
# contract (a callee answering out of range, impossible asset data): the
# original and clang lay out frames differently, so the out-of-bounds slot
# differs. With in-contract inputs the C is equivalent.
[difftest.exclude]
ovl_11_func_800ED7E0 = "choices.values[i] read with i == 5 when Rand(count) answers >= count; reads past the 5-element local array"
ovl_11_func_800E7D4C = "enabled[group][Rand(6)] indexes a local array; answers outside 0..5 read past it"
BuildSpriteEntryPackets = "clutList[12] has no bound; random frames with more than 12 distinct CLUT keys overflow it"

# The UBSan variant's documented reports (M2 task 13): functions built
# without sanitizer checks, each with the report and why the C is sound.
[ubsan.ignore]
StartSoundArchiveRead = "array-bounds: the decomp declares gSoundArchiveOffsets[3], but the table is 0x25C bytes (151 entries) and the archive index ranges over all of it"
StepSoundLoad = "array-bounds: the decomp declares gSoundArchiveOffsets[3], but the table is 0x25C bytes (151 entries) and the archive index ranges over all of it"
BeginSoundBankBodyTransfer = "array-bounds: the decomp declares gSoundArchiveOffsets[3], but the table is 0x25C bytes (151 entries) and the archive index ranges over all of it"

# Named hook points for mods (plans/M11): real function boundaries many
# mods want. A hook with "target": { "point": "frame" } is an `after` hook
# on PollPadInputs, which RunSceneUpdateLoop calls once per scene frame.
[mod]
# The decomp's previous pin (census built): the mods gate checks script
# mods across decomp iterations against its snapshot (plans/M12 phase 3).
previous_decomp = "3a159925fe0994ae43f11fd990eb6f5339f5833f"

[mod.points]
frame = { after = "PollPadInputs", doc = "once per scene frame, after the pads are read" }
boot = { before = "main", doc = "once, when the executable starts" }

[chips]
# The chips this game runs native through their adapters (D59); a build
# that falls back to one's device fails. The rest are emulated.
native = ["cd"]
