# Power-on to the first field scene with player control (M13 task 19),
# then a walk in four directions. Presses are frame-counter values
# ([oracle] frame_counter, D_80116B20: main's loop passes); BUTTON@AT:HOLD
# holds for HOLD counter steps. Authored from headless frame dumps (`psxw run
# bof4 --replay title-to-field --render server --dump-frames DIR`).
#
# - Capcom logo, then the intro FMV from about counter 780; START at 850
#   skips it to the title, START at 950 opens the menu, CROSS at 1000
#   picks NEW GAME, START at 1100 keeps the default name.
# - CROSS every 40 steps from 1200 to 12280 advances the opening (the
#   sand flier, "I: Awakening", the crash, Nina and Cray at the wreck).
#   Control starts near 12300; CROSS after that would talk to Cray.
# - UP, RIGHT, DOWN, LEFT for 30 steps each from 12400.
# - SQUARE at 12650 opens the field menu, which calls into the overlay
#   `ovl_4504` at a function its split starts two instructions late.
#
# One pad: with a second one plugged in, the game takes another path and
# draws nothing.
# Since D66 the pad interrupt takes about 13,000 cycles, not ten quanta,
# and the field comes about 370 frames later than when the replay was
# authored (counter 12390 at frame 25138, was 24768).
frames = 26000
pads = 1
press = [
