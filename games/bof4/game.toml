# Breath of Fire IV (SLUS-01324).
# Everything game-specific the toolchain needs that the pinned repo doesn't
# already say. Paths under [containers], [c] and [probe] are relative to the
# snapshot; [reference] is relative to the local checkout. Original bytes
# come from each splat config's target_path/sha1 in the local checkout: the
# boot EXE, and one container per code component of the disc's EMI archives.

[game]
id = "bof4"
title = "Breath of Fire IV"
serial = "SLUS-01324"
input = "bof4"              # [game.bof4] in inputs.lock
sdk = "psyq-470"            # signature match: PSY-Q 4.7 (350 signatures, 4.6 next with 343)
boundary = "boundary/psyq.toml"

[containers]
splat_dir = "configs/splat"
symbols_dir = "configs/symbols"
main = "exe"

[c]
include = ["include"]
defines = ["__GNUC__=2", "_LANGUAGE_C", "INCLUDE_ASM_USE_MACRO_INC=1"]

[probe]
# No game types are recovered yet; run the census with --no-probe until
# headers declare some.
include_dirs = ["include"]
prelude = ["common.h"]

[reference]
# The decomp's matching compiler (toolchain.json), provisioned by the
# harness at runtime, not in the checkout. Only the layout probe uses it.
cpp = "mips-linux-gnu-cpp"
cppflags = ["-Iinclude", "-undef", "-D__GNUC__=2", "-DINCLUDE_ASM_USE_MACRO_INC=1", "-lang-c", "-D_LANGUAGE_C"]
cc1 = "dependencies/compiler/gcc-2.95.2-psx/cc1"
cc1flags = ["-O2", "-G8", "-mips1", "-mcpu=r3000", "-funsigned-char", "-fpeephole", "-ffunction-cse", "-fpcc-struct-return", "-fcommon", "-msoft-float", "-mgas", "-fgnu-linker", "-quiet"]

[run]
# main's loop (0x8013965C) calls this once a pass, after VSync: the thread
# scheduler, which opens the game's worker threads and ChangeThreads to
# each in turn (D57).
main_loop_symbol = "func_8013A37C"
cd_timing = "realistic"

[oracle]
# main adds one to this word at the end of every pass of its loop
# (0x801397C4), so it counts game frames: fewer than vblanks while a scene
# runs at half rate or loads. Found by diffing RAM across frames.
frame_counter = "D_80116B20"
