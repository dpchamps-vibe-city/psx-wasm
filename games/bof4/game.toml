[run]
# main's loop (0x8013965C) calls this once a pass, after VSync: the thread
# scheduler, which opens the game's worker threads and ChangeThreads to
# each in turn (D57).
main_loop_symbol = "func_8013A37C"
cd_timing = "realistic"

[oracle]
# main adds one to this word at the end of every pass of its loop
# (0x801397C4), so it counts game frames: fewer than vblanks while a scene
# runs at half rate or loads. Found by diffing RAM across frames.
frame_counter = "D_80116B20"

[conform]
# Chip cases (psxw conform bof4 --chip C) install this as their interrupt
# callback: a leaf that adds one to byte 7 of the block at 0x8011C998 (the
# top byte of this word counts its calls) and otherwise writes only that
# block, from the index at its byte 5.
callback = "func_8013BBA8"
callback_state = "D_8011C99C"

[chips]
# The chips this game runs native through their adapters (D59); a build
# that falls back to one's device fails. The rest are emulated.
native = ["cd", "gpu", "irq", "mdec", "sio0", "spu"]

[ci]
# The layout probe compares game struct layouts under the matching
# compiler and clang. bof4-decomp's headers declare no game types yet, and
# its matching cc1 is provisioned by the harness at build time, not kept in
# the checkout. Both `psxw census` and `psxw ci` use this default.
census_no_probe = true
# Title to the first field scene (M13), with its reached-state checks.
replay = "title-to-field"

[ci.skip]
difftest = "M13: no decompiled C yet, so nothing to compare against its translation"
mods = "M9: no mods for this game yet"
web-gpu = "M9: the browser host for this game is out of M13's scope"
web-conform = "M9: the browser host for this game is out of M13's scope"
web-storage = "M9: the browser host for this game is out of M13's scope"
web-game = "M9: the browser host for this game is out of M13's scope"
web-pacing = "M9: the browser host for this game is out of M13's scope"
