[package]
name = "psxw-difftest"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
psxw-abi = { path = "../psxw-abi" }
psxw-cc = { path = "../psxw-cc" }
psxw-inputs = { path = "../psxw-inputs" }
psxw-lift = { path = "../psxw-lift" }
psxw-link = { path = "../psxw-link" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasmparser = "0.262.0"
wasmtime = { version = "47.0.0", default-features = false, features = ["cranelift", "runtime", "parallel-compilation", "anyhow"] }
