[package]
name = "psxw-host-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The browser host's Rust half (M5): the WebGL2 renderer the Worker drives.
# The host interface itself is wired in web/worker.js.
[target.'cfg(target_arch = "wasm32")'.dependencies]
glow = "0.18.0"
psx-render-gl = { path = "../psx-render-gl" }
psxw-abi = { path = "../psxw-abi" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "WebGl2RenderingContext"] }
