[package]
name = "psx-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# `psxw runtime build` builds this as a cdylib for wasm32 (runtime.wasm);
# natively it's a library for tests.
[lib]
crate-type = ["rlib"]

[dependencies]
psxw-abi = { path = "../psxw-abi" }
psx-gte = { path = "../psx-gte" }
psx-devices = { path = "../psx-devices" }
psx-bios = { path = "../psx-bios" }
sdk-psyq = { path = "../sdk-psyq" }
