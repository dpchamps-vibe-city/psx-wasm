[package]
name = "psxw-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "psxw"
path = "src/main.rs"
[dependencies]
anyhow = "1.0.104"
psxw-census = { version = "0.0.0", path = "../psxw-census" }
psxw-inputs = { path = "../psxw-inputs" }
psxw-lift = { path = "../psxw-lift" }
psxw-cc = { path = "../psxw-cc" }
psxw-difftest = { path = "../psxw-difftest" }
psxw-build = { path = "../psxw-build" }
psxw-modkit = { path = "../psxw-modkit" }
psxw-host-native = { path = "../psxw-host-native" }
psxw-abi = { path = "../psxw-abi" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
psxw-oracle = { path = "../psxw-oracle" }
sdk-psyq = { path = "../sdk-psyq" }
psxw-gpu-oracle = { path = "../psxw-gpu-oracle" }
psx-devices = { path = "../psx-devices" }
psxw-link = { path = "../psxw-link" }
wasmparser = "0.262.0"
sha2 = "0.11.1"
