# Pinned inputs — see docs/design.md "Pinning the inputs".
#
# Each input repo is materialized read-only with `git archive <commit>` into
# .inputs/<name>-<short>/; the local checkout is only used as the object
# store, so its working tree and uncommitted work are never touched.

[toolchain.clang]
# Only clang is used (freestanding wasm32), not the WASI libc.
dist = "wasi-sdk-34.0-x86_64-linux"
url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz"
sha256 = "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"

[toolchain.binaryen]
# wasm-opt, run over every linked module.
dist = "binaryen-version_133"
url = "https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz"
sha256 = "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"

[toolchain.wasm-bindgen]
# The wasm-bindgen CLI, the same version as the wasm-bindgen crate in
# Cargo.lock (glow's web backend); generates the browser host's JS glue.
dist = "wasm-bindgen-0.2.129-x86_64-unknown-linux-musl"
url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz"
sha256 = "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e"

[toolchain.psyq-signatures]
# PsyQ object signatures per SDK version (lab313ru/psx_psyq_signatures at
# e9e46e7): byte patterns with relocated bytes masked, plus function
# offsets. M8's object identity matches linked SDK members against them.
dist = "psx_psyq_signatures-e9e46e7e133ef275a79bfce650924f98edb086bc"
url = "https://codeload.github.com/lab313ru/psx_psyq_signatures/tar.gz/e9e46e7e133ef275a79bfce650924f98edb086bc"
sha256 = "3e06ce2bdd4e6ed215a9f465856d5406554f1281c119075f8489a18d774896ac"

[oracle]
# The device oracle's Docker images (plans/M03-oracle-harness.md). Both are
# built on this base, and install Debian packages from the snapshot the base
# image itself was built from. Built image IDs go to .oracle/images.json.
base_image = "debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"
debian_snapshot = "20261020T213255Z"

[oracle.beetle]
# Beetle PSX (Mednafen's PlayStation core), software renderer, interpreter.
repo = "https://github.com/libretro/beetle-psx-libretro"
commit = "7fea57a541abb39b8c5035b6261c3e70962d221b"

[oracle.openbios]
# OpenBIOS is PCSX-Redux src/mips/openbios; src/mips is the nugget
# submodule, whose commit is the gitlink at the PCSX-Redux commit (the image
# build checks they agree).
repo = "https://github.com/grumpycoders/pcsx-redux"
commit = "8a86b7ec1d246eb5ae9b213cac27aa2f7854a176"
nugget_repo = "https://github.com/pcsx-redux/nugget"
nugget_commit = "4dc70d2931121a0fde858a0354192b6df4fa22e8"

[oracle.render_gl]
# The GPU backend's headless image, psxw-render-gl (plans/M04-pixels.md):
# Mesa llvmpipe (EGL surfaceless) from the [oracle] Debian snapshot on the
# same base image, plus this Rust toolchain to build the render server.
rust_version = "1.94.1"
rust_url = "https://static.rust-lang.org/dist/rust-1.94.1-x86_64-unknown-linux-gnu.tar.xz"
rust_sha256 = "294b3d81fa72e62581276290c60c81eb8b58498d333d422ca1dfc432877d0c40"

[oracle.psn00bsdk]
# The release archive bundles the toolchain (GCC mipsel-none-elf) and
# mkpsxiso; the image build checks the GCC version.
release = "v0.24"
url = "https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip"
sha256 = "5ada7c9478d795b22bde96ee23d6869290c14a740bcde3d57c01c342a26ded35"
toolchain = "gcc-mipsel-none-elf-12.3.0"

