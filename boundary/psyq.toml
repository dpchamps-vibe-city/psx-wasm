# The PsyQ boundary (docs/design.md §5; M8): for every SDK library, how
# its functions run. Game-agnostic and version-independent: objects are
# told apart by identity (`psxw identity <game>`), and adapters bind only
# to objects they are validated for (sdk-psyq `validated.rs`).
#
# policy = "adapter"  functions with a runtime adapter for this exact
#                     object run it; the rest are guest code. A function
#                     that touches hardware itself and has no validated
#                     adapter fails the build.
# policy = "device"   guest code whose I/O reaches the runtime's
#                     register-level devices (D40); no adapters.
# policy = "guest"    guest code only (decompiled C or translated);
#                     adapters must not claim these.
# policy = "adapter-or-device"
#                     decided per game for the whole library (D58): its
#                     adapters when every placed object defining one of
#                     their functions is validated, otherwise its original
#                     code over the devices. Never a mix: the adapters keep
#                     state in the runtime that the original can't see.
#
# Every library a game places must have an entry here; an unknown one
# fails the build (M13).
#
# [object."<library>/<member>"] overrides a library's policy for one
# member.

[library.libapi]   # BIOS trampolines go to the Rust BIOS; counter.o, pad.o,
policy = "adapter" # patch.o, first.o patch BIOS internals or program timers

[library.libetc]   # D45: original over the IRQ controller, DMA and timers,
policy = "device"  # entered through the BIOS's custom exception exit

[library.libgpu]   # D42: original over the GPU front end and DMA
policy = "device"

[library.libcd]    # D58: adapters at the drive (CdInit, CdControl*, CdRead*,
policy = "adapter-or-device" # CdSearchFile, …) for validated objects, else the
                    # original over the register-level CD controller

[library.libds]    # D58: the original over the register-level CD controller
policy = "device"  # (no adapters exist)

[library.libpress] # the original over the MDEC (DMA0 in, DMA1 out)
policy = "device"

[library.libspu]   # D47: original over the register-level SPU and DMA4
policy = "device"

[library.libpad]   # D40: original over SIO0
policy = "device"

[library.libmcrd]  # guest code over the BIOS card functions
policy = "guest"

[library.libmcx]
policy = "adapter"

[library.libcard]
policy = "adapter"

[library.libsnd]   # D47: the sequencer is the game's music: original code,
policy = "device"  # its direct SPU register writes routed to the SPU

[library.libgs]    # packet building into RAM
policy = "guest"

[library.libgte]   # COP2 through psx-gte
policy = "guest"

[library.libc]
policy = "guest"

[library.libc2]
policy = "guest"

[library.libmath]
policy = "guest"

[library.libsn]    # SN Systems' C++ runtime (op_vnew, op_vdel): plain code
policy = "guest"

[library.2mbyte]   # SN's startup: assembly by design, touches no hardware
policy = "guest"

# The structs adapters read and write, generated into Rust constants by
# `psxw layout <game>` from the game's SDK headers (offsets checked equal
# under the matching compiler and clang). Adapters use these, never
# hand-written offsets.
[layout]
headers = ["psyq/libgpu.h", "psyq/libcd.h", "psyq/libspu.h"]
structs = [
  "RECT", "DRAWENV", "DISPENV",
  "CdlLOC", "CdlFILE",
  "SpuVolume", "SpuVoiceAttr", "SpuReverbAttr", "SpuExtAttr", "SpuCommonAttr",
]
output = "crates/sdk-psyq/src/layout.rs"
