# The PsyQ boundary (docs/design.md §5; M8): for every SDK library, how
# its functions run. Game-agnostic and version-independent: objects are
# told apart by identity (`psxw identity <game>`), and adapters bind only
# to objects they are validated for (sdk-psyq `validated.rs`).
#
# policy = "adapter"  functions with a runtime adapter for this exact
#                     object run it; the rest are guest code. A function
#                     that touches hardware itself and has no validated
#                     adapter fails the build.
# policy = "device"   guest code whose I/O reaches the runtime's
#                     register-level devices (D40); no adapters.
# policy = "guest"    guest code only (decompiled C or translated);
#                     adapters must not claim these.
# policy = "adapter-or-device"
#                     decided per game for the whole chip group the member
#                     is in (D59; [chip.*] below): its adapters when the
#                     chip runs native, otherwise its original code over
#                     the chip's device. A chip never mixes the two.
#
# Every library a game places must have an entry here; an unknown one
# fails the build (M13).
#
# [object."<library>/<member>"] overrides a library's policy for one
# member.

[library.libapi]   # BIOS trampolines go to the Rust BIOS; pad.o, patch.o,
policy = "adapter" # first.o patch BIOS internals (mandatory adapters)

[object."libapi/counter"] # chip irq: the root counters
policy = "adapter-or-device"

[library.libetc]   # chip irq; on its device (D45), the BIOS enters libetc's
policy = "adapter-or-device" # dispatcher through its custom exception exit

[library.libgpu]   # chip gpu; on its device (D42), the GPU front end and DMA
policy = "adapter-or-device"

[library.libcd]    # chip cd; on its device (D58), the CD controller
policy = "adapter-or-device"

[library.libds]    # chip cd: guest code over libcd's adapters, or over the
policy = "adapter-or-device" # original and the CD controller (D58)

[library.libpress] # chip mdec; on its device, the MDEC (DMA0 in, DMA1 out)
policy = "adapter-or-device"

[library.libspu]   # chip spu; on its device (D47), the SPU and DMA4
policy = "adapter-or-device"

[library.libpad]   # chip sio0; on its device (D40), SIO0
policy = "adapter-or-device"

[library.libmcrd]  # guest code over the BIOS card functions
policy = "guest"

[library.libmcx]
policy = "adapter"

[library.libcard]
policy = "adapter"

[library.libsnd]   # chip spu: the sequencer is the game's music, original
policy = "adapter-or-device" # code; its few SPU accesses are adapted or on the device

[library.libgs]    # packet building into RAM
policy = "guest"

[library.libgte]   # COP2 through psx-gte
policy = "guest"

[library.libc]
policy = "guest"

[library.libc2]
policy = "guest"

[library.libmath]
policy = "guest"

[library.libsn]    # SN Systems' C++ runtime (op_vnew, op_vdel): plain code
policy = "guest"

[library.2mbyte]   # SN's startup: assembly by design, touches no hardware
policy = "guest"

# Chip groups (D59): the libraries and objects that drive each chip. A
# chip runs native (its members' adapters) or emulated (their original
# code over its device), never a mix: see `psxw build`'s per-chip report.
# Libraries here that touch no register themselves (libds) run as guest
# code over the chip's adapters, or over the original.

[chip.irq]         # the interrupt controller, root counters, vblank
members = ["libetc", "libapi/counter"]

[chip.gpu]
members = ["libgpu"]

[chip.sio0]        # pads
members = ["libpad"]

[chip.cd]          # libds and streaming ride on libcd's drive layer
members = ["libcd", "libds"]

[chip.mdec]
members = ["libpress"]

[chip.spu]
members = ["libspu", "libsnd"]

# The structs adapters read and write, generated into Rust constants by
# `psxw layout <game>` from the game's SDK headers (offsets checked equal
# under the matching compiler and clang). Adapters use these, never
# hand-written offsets.
[layout]
headers = ["psyq/libgpu.h", "psyq/libcd.h", "psyq/libspu.h"]
structs = [
  "RECT", "DRAWENV", "DISPENV",
  "CdlLOC", "CdlFILE",
  "SpuVolume", "SpuVoiceAttr", "SpuReverbAttr", "SpuExtAttr", "SpuCommonAttr",
]
output = "crates/sdk-psyq/src/layout.rs"
