# HLE boundary for PsyQ 4.7. Game-agnostic: any game built with this SDK
# reuses it; games override entries in their own manifest.
#
# policy = "compile"  C from the SDK decomp when present, otherwise lift
# policy = "replace"  runtime import (Rust), C prototype checked vs headers
# policy = "lift"     never use C for this entry
#
# Rule: replace the lowest function with a clean semantic contract; run
# everything above it as guest code. Sketch — function lists are not complete.

[lib.libapi]   # BIOS A0/B0/C0 stubs
policy = "replace"

[lib.libetc]   # VSync, callbacks, root counters, interrupt setup
policy = "replace"

[lib.libgpu]
policy = "compile"
replace = [
  "ResetGraph", "GetGraphType", "SetGraphDebug",
  "DrawOTag", "DrawOTagEnv", "DrawPrim", "DrawSync", "DrawSyncCallback",
  "LoadImage", "StoreImage", "MoveImage", "ClearImage", "ClearImage2",
  "PutDrawEnv", "PutDispEnv", "SetDispMask", "GetODE",
]

[lib.libgs]    # packet building on top of libgpu/libgte
policy = "compile"

[lib.libgte]   # COP2 via psx-gte in both C and lifted code
policy = "compile"

[lib.libcd]
policy = "compile"
replace = [
  "CdInit", "CdReset", "CdControl", "CdControlB", "CdControlF",
  "CdSync", "CdReady", "CdSyncCallback", "CdReadyCallback",
  "CdGetSector", "CdGetSector2", "CdRead", "CdReadSync", "CdReadCallback",
  "CdReadBreak", "CdSearchFile", "CdFlush", "CdDataSync",
]

[lib.libspu]   # register programming
policy = "replace"

[lib.libsnd]   # SEQ/VAB sequencer, ticked by runtime timer callbacks
policy = "compile"

[lib.libpad]
policy = "replace"

[lib.libmcrd]
policy = "replace"

[lib.libmcx]
policy = "replace"

[lib.libcard]
policy = "replace"

[lib.libc]
policy = "compile"

[lib.libmath]  # softfloat; clang emits native f32/f64 for the game's C
policy = "compile"
